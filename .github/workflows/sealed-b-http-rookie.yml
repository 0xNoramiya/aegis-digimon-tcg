name: Sealed B mandatory ordinary browser gate

on:
  push:
    branches:
      - ci/sealed-b-d6a3-browser

permissions:
  contents: read

jobs:
  b-http-rookie:
    if: github.repository == '0xNoramiya/aegis-digimon-tcg' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "26.10.0"
      - uses: pnpm/action-setup@v6
        with:
          version: 10.30.1
          run_install: false
      - name: Collect exact33 current-head cases then execute all33 cases
        shell: bash
        env:
          B_EVIDENCE_ROOT: ${{ runner.temp }}/sealed-b-http-rookie/evidence
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/sealed-b-http-rookie"
          trap 'rc=$?; printf "%s\n" "$rc" > "$RUNNER_TEMP/sealed-b-http-rookie/bootstrap.exit"' EXIT
          python3 -B tools/ci/sealed-b-http-rookie.py 2>&1 | tee "$RUNNER_TEMP/sealed-b-http-rookie/bootstrap.log"
      - name: Retain conventional results and full snapshot ledgers
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sealed-b-http-rookie-${{ github.sha }}
          path: |
            ${{ runner.temp }}/sealed-b-http-rookie/evidence
            ${{ runner.temp }}/sealed-b-http-rookie/bootstrap.log
            ${{ runner.temp }}/sealed-b-http-rookie/bootstrap.exit
            ${{ github.workspace }}/.local/validation
          if-no-files-found: error
          retention-days: 14
