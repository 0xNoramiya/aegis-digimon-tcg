name: Fixed-source Swiss root mobile preparation
on:
  push:
    branches: [ci/sealed-d-d6a3-root-touch]
permissions:
  contents: read
jobs:
  private-media:
    if: github.repository == '0xNoramiya/aegis-digimon-tcg' && github.ref == 'refs/heads/ci/sealed-d-d6a3-root-touch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.1
          run_install: false
      - name: One original Swiss root preparation touch case
        run: python3 -B tools/ci/sealed-private-media.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: swiss-root-mobile-preparation-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/swiss-root-mobile-preparation
          if-no-files-found: error
          retention-days: 7
