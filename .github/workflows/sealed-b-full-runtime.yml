name: Sealed B full API cards and conformance runtime

on:
  push:
    branches:
      - ci/sealed-b-full-runtime-7b9a1f7

permissions:
  contents: read

jobs:
  b-full-runtime:
    if: github.repository == '0xNoramiya/aegis-digimon-tcg' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: b_disposable_only
          POSTGRES_DB: aegis_sealed_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d aegis_sealed_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 24
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "26.10.0"
      - uses: pnpm/action-setup@v6
        with:
          version: 10.30.1
          run_install: false
      - name: Run original full public API command under named parent-approved profile
        shell: bash
        env:
          B_EVIDENCE_ROOT: ${{ runner.temp }}/sealed-b-full-runtime/evidence
          B_PG_CONTAINER: ${{ job.services.postgres.id }}
          POSTGRES_TEST_URL: postgres://postgres:b_disposable_only@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/aegis_sealed_test
          POSTGRES_TESTS: "1"
          STORY_BALANCE: "1"
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/sealed-b-full-runtime"
          trap 'rc=$?; printf "%s\n" "$rc" > "$RUNNER_TEMP/sealed-b-full-runtime/bootstrap.exit"' EXIT
          python3 -B tools/ci/sealed-b-full-runtime.py 2>&1 | tee "$RUNNER_TEMP/sealed-b-full-runtime/bootstrap.log"
      - name: Retain actual exits reports restoration and conventional input ledgers
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sealed-b-full-runtime-${{ github.sha }}
          path: |
            ${{ runner.temp }}/sealed-b-full-runtime/evidence
            ${{ runner.temp }}/sealed-b-full-runtime/bootstrap.log
            ${{ runner.temp }}/sealed-b-full-runtime/bootstrap.exit
          if-no-files-found: error
          retention-days: 14
