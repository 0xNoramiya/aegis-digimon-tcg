name: Sealed D original browser native verification
on:
  push:
    branches: [ci/sealed-d-browser-native]
permissions:
  contents: read
jobs:
  original-browser:
    if: github.repository == '0xNoramiya/aegis-digimon-tcg' && github.ref == 'refs/heads/ci/sealed-d-browser-native'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.1
          run_install: false
      - name: Initialize bootstrap evidence
        run: |
          mkdir -p "$RUNNER_TEMP/sealed-c-browser-native"
          printf '{"status":"not-started","exit":null}\n' > "$RUNNER_TEMP/sealed-c-browser-native/helper-exit.json"
          : > "$RUNNER_TEMP/sealed-c-browser-native/helper.log"
      - name: Helper oracle only
        shell: bash
        run: |
          set +e
          python3 tools/ci/sealed-c-browser-native.test.py 2>&1 | tee "$RUNNER_TEMP/sealed-c-browser-native/helper.log"
          rc=${PIPESTATUS[0]}
          printf '{"status":"completed","exit":%s}\n' "$rc" > "$RUNNER_TEMP/sealed-c-browser-native/helper-exit.json"
          exit "$rc"
      - name: Original tests under approved monitor
        env:
          AEGIS_CI_OUT: ${{ runner.temp }}/sealed-c-browser-native
        run: python3 tools/ci/sealed-c-browser-native.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sealed-c-browser-native-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/sealed-c-browser-native
            apps/web/test-results
            apps/web/playwright-report
          if-no-files-found: error
          retention-days: 14
