name: Sealed full native E2E types

on:
  push:
    branches:
      - ci/sealed-d-memorydom-live-full-types

permissions:
  contents: read

jobs:
  native-e2e-full-types:
    if: github.repository == '0xNoramiya/aegis-digimon-tcg' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "26.10.0"
      - uses: pnpm/action-setup@v6
        with:
          version: 10.30.1
          run_install: false
      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/native-e2e-full-types"
          trap 'rc=$?; printf "%s\\n" "$rc" > "$RUNNER_TEMP/native-e2e-full-types/install.exit"' EXIT
          node --version | tee "$RUNNER_TEMP/native-e2e-full-types/node-version.log"
          pnpm --version | tee "$RUNNER_TEMP/native-e2e-full-types/pnpm-version.log"
          pnpm install --frozen-lockfile --ignore-scripts 2>&1 | tee "$RUNNER_TEMP/native-e2e-full-types/install.log"
      - name: Build shared
        shell: bash
        run: |
          set -o pipefail
          trap 'rc=$?; printf "%s\\n" "$rc" > "$RUNNER_TEMP/native-e2e-full-types/shared-build.exit"' EXIT
          test -z "$(git ls-files packages/shared/dist apps/api/dist)"
          rm -rf packages/shared/dist apps/api/dist
          pnpm --filter @aegis/shared build 2>&1 | tee "$RUNNER_TEMP/native-e2e-full-types/shared-build.log"
      - name: Check whole original native E2E project
        shell: bash
        run: |
          set -o pipefail
          node tools/typescript/runAuthorizedE2eFullTypes.mjs 2>&1 | tee "$RUNNER_TEMP/native-e2e-full-types/compiler.log"
      - name: Retain native verification evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sealed-native-e2e-full-types-${{ github.sha }}
          path: ${{ runner.temp }}/native-e2e-full-types
          if-no-files-found: error
          retention-days: 14
