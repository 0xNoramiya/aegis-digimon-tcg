name: Sealed C original social lifecycle7
on:
  push:
    branches: [ci/sealed-c-social-lifecycle]
permissions:
  contents: read
jobs:
  native:
    if: github.repository == '0xNoramiya/aegis-digimon-tcg'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: aegis_sealed_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:55439:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aegis_sealed_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      NODE_OPTIONS: --max-old-space-size=2048
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 10.30.1
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: pnpm
      - name: Create retained logs
        shell: bash
        run: |
          umask 077
          mkdir -m 700 -p .local/sealed-c-social-lifecycle-native
          printf 'AEGIS_SOCIAL_SCHEMA_RECEIPT_OUT=%s/.local/sealed-c-social-lifecycle-native\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          printf 'AEGIS_SOCIAL_SCHEMA_TASK_NONCE=%s\n' "$(python3 -c 'import uuid; print(uuid.uuid4())')" >> "$GITHUB_ENV"
          printf 'AEGIS_SOCIAL_SCHEMA_SOURCE_SHA=4cc84a6b6f6b0b45aafc923cbdb935b511c96533\n' >> "$GITHUB_ENV"
          printf 'SEALED_TEST_DATABASE_URL=postgres://postgres@127.0.0.1:55439/aegis_sealed_test\n' >> "$GITHUB_ENV"
      - name: Source guard before install
        run: python3 tools/ci/sealed-c-social-lifecycle-native.py --source-check source-before-install
      - name: Frozen install
        shell: bash
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee .local/sealed-c-social-lifecycle-native/install.log
      - name: Source guard after install
        if: always()
        run: python3 tools/ci/sealed-c-social-lifecycle-native.py --source-check source-after-install
      - name: CI helper negative tests
        shell: bash
        run: |
          set -o pipefail
          python3 tools/ci/sealed-c-social-lifecycle-native.test.py 2>&1 | tee .local/sealed-c-social-lifecycle-native/helper-tests.log
      - name: Actual unchanged social lifecycle7
        env:
          SEALED_PG_CONTAINER: ${{ job.services.postgres.id }}
        shell: bash
        run: |
          set -o pipefail
          python3 tools/ci/sealed-c-social-lifecycle-native.py 2>&1 | tee .local/sealed-c-social-lifecycle-native/driver.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sealed-c-social-lifecycle-native-${{ github.sha }}
          path: .local/sealed-c-social-lifecycle-native
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
